<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Universal AI Proxy Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
    <style>
        body { background-color: #0b0f17; color: #c9d1d9; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex flex-col items-center justify-center">
    <div class="max-w-lg w-full bg-gray-900 border border-gray-800 rounded-2xl p-5 sm:p-6 shadow-2xl">
        
        <div class="flex items-center justify-between mb-4 border-b border-gray-800 pb-3">
            <div>
                <h1 class="text-sm font-bold text-white flex items-center gap-2">
                    🛡️ Dynamic Universal Agent
                </h1>
                <p id="device-type-label" class="text-[10px] text-gray-400 font-mono mt-0.5">Detecting environment...</p>
            </div>
            <span id="agent-status" class="px-2.5 py-1 bg-amber-950 text-amber-400 border border-amber-800 rounded-full text-[10px] font-mono">Initializing</span>
        </div>

        <div class="space-y-3 text-xs mb-4">
            <div class="bg-gray-950 p-3 rounded-lg border border-gray-800 space-y-1.5 font-mono">
                <div class="flex justify-between"><span>HW ID:</span> <span id="lbl-hw" class="text-cyan-400 font-bold truncate max-w-[180px]">-</span></div>
                <div class="flex justify-between"><span>Status:</span> <span id="lbl-status" class="text-amber-400 font-bold">Pending</span></div>
                <div class="flex justify-between"><span>Tier:</span> <span id="lbl-tier" class="text-purple-400 font-bold">-</span></div>
                <div class="flex justify-between"><span>Balance:</span> <span id="lbl-balance" class="text-emerald-400 font-bold">-</span></div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Target AI Model</label>
                    <select id="cfg-model" onchange="updateDynamicConfig()" class="w-full bg-gray-950 border border-gray-800 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
                        <option value="Claude 3.5 Sonnet">Claude 3.5 Sonnet</option>
                        <option value="GPT-4o">GPT-4o</option>
                        <option value="DeepSeek-V3">DeepSeek-V3</option>
                        <option value="Llama 3.3 70B">Llama 3.3 70B</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Think Level</label>
                    <select id="cfg-think" onchange="updateDynamicConfig()" class="w-full bg-gray-950 border border-gray-800 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
                        <option value="Extended">Extended</option>
                        <option value="Deep">Deep</option>
                        <option value="Standard">Standard</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Country Code</label>
                    <input type="text" id="cfg-country" value="IND" onchange="updateDynamicConfig()" class="w-full bg-gray-950 border border-gray-800 rounded px-2 py-1.5 text-xs text-white font-mono">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Region / Geo</label>
                    <input type="text" id="cfg-geo" value="Maharashtra" onchange="updateDynamicConfig()" class="w-full bg-gray-950 border border-gray-800 rounded px-2 py-1.5 text-xs text-white">
                </div>
            </div>
        </div>

        <div class="space-y-3">
            <div class="border border-gray-800 rounded-lg p-3 bg-gray-950">
                <label class="block text-[11px] font-bold text-gray-300 mb-1">Live Proxy Request Test</label>
                <div class="flex gap-2">
                    <input type="text" id="test-prompt" placeholder="Enter security prompt..." class="flex-1 bg-gray-900 border border-gray-800 rounded px-3 py-2 text-xs text-white focus:outline-none">
                    <button onclick="sendLiveProxyCall()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded text-xs transition">Send</button>
                </div>
            </div>

            <div class="bg-gray-950 rounded-lg p-3 border border-gray-800 h-32 overflow-y-auto font-mono text-[10px] text-gray-400 space-y-1" id="activity-log">
                <div>[System] Initializing dynamic node state...</div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = window.location.origin;

        function detectPlatformProfile() {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) return { type: 'ANDROID', prefix: 'MOB-AND' };
            if (/ipad|iphone|ipod/i.test(ua)) return { type: 'IOS', prefix: 'MOB-IOS' };
            if (/win/i.test(ua)) return { type: 'WINDOWS', prefix: 'WIN-PC' };
            if (/mac/i.test(ua)) return { type: 'MACOS', prefix: 'MAC-PC' };
            return { type: 'LINUX', prefix: 'LIN-PC' };
        }

        const profile = detectPlatformProfile();
        document.getElementById("device-type-label").innerText = `Runtime: Browser Agent (${profile.type})`;

        let hwId = localStorage.getItem("proxy_dynamic_hw_id");
        if (!hwId) {
            hwId = profile.prefix + "-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            localStorage.setItem("proxy_dynamic_hw_id", hwId);
        }
        document.getElementById("lbl-hw").innerText = hwId;

        let publicKeyPem = "";
        let dynamicRuntimeState = {
            version: "v2.5-dynamic",
            balanceTokens: 0,
            subscriptionTier: "PENDING"
        };

        function logActivity(msg, isError = false) {
            const box = document.getElementById("activity-log");
            const timeStr = new Date().toLocaleTimeString();
            box.innerHTML += `<div class="${isError ? 'text-red-400' : 'text-emerald-400'}">[${timeStr}] ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function getConfig() {
            return {
                model_name: document.getElementById("cfg-model").value,
                think_level: document.getElementById("cfg-think").value,
                country: document.getElementById("cfg-country").value.trim() || "IND",
                geo_location: document.getElementById("cfg-geo").value.trim() || "Maharashtra"
            };
        }

        async function initAgent() {
            try {
                const pubRes = await fetch(`${SERVER_URL}/public-key`);
                publicKeyPem = await pubRes.text();
                await registerAgentWithServer();
                pollStatus();
            } catch (err) {
                logActivity("Initialization error: " + err.message, true);
            }
        }

        async function registerAgentWithServer() {
            const cfg = getConfig();
            try {
                const regRes = await fetch(`${SERVER_URL}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        hw_id: hwId,
                        hostname: window.location.hostname || `${profile.type}-Node`,
                        mac_address: "DYN-MAC-" + hwId.substring(4),
                        client_name: `Dynamic Web Agent (${profile.type})`,
                        model_name: cfg.model_name,
                        model_version: dynamicRuntimeState.version,
                        think_level: cfg.think_level,
                        interface_browser: navigator.userAgent.substring(0, 80),
                        country: cfg.country,
                        geo_location: cfg.geo_location
                    })
                });
                const regData = await regRes.json();
                
                dynamicRuntimeState.subscriptionTier = regData.subscription_tier || "STANDARD";
                dynamicRuntimeState.balanceTokens = regData.balance_tokens || 10000;
                if(regData.agent_version) dynamicRuntimeState.version = regData.agent_version;

                document.getElementById("lbl-tier").innerText = dynamicRuntimeState.subscriptionTier;
                document.getElementById("lbl-balance").innerText = dynamicRuntimeState.balanceTokens.toLocaleString();
                
                updateStatusBadge(regData.client_status || "PENDING");
                logActivity(`Dynamic sync complete [Tier: ${dynamicRuntimeState.subscriptionTier}]`);
            } catch (e) {
                logActivity("Registration sync error: " + e.message, true);
            }
        }

        async function updateDynamicConfig() {
            logActivity("Syncing updated dynamic config parameters...");
            await registerAgentWithServer();
        }

        function updateStatusBadge(status) {
            const badge = document.getElementById("agent-status");
            const lbl = document.getElementById("lbl-status");
            lbl.innerText = status;
            if (status === "APPROVED") {
                badge.className = "px-2.5 py-1 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded-full text-[10px] font-mono";
                badge.innerText = "Active & Approved";
            } else if (status === "DENIED") {
                badge.className = "px-2.5 py-1 bg-red-950 text-red-400 border border-red-800 rounded-full text-[10px] font-mono";
                badge.innerText = "Access Denied";
            } else {
                badge.className = "px-2.5 py-1 bg-amber-950 text-amber-400 border border-amber-800 rounded-full text-[10px] font-mono";
                badge.innerText = "Pending Approval";
            }
        }

        async function pollStatus() {
            setInterval(async () => {
                try {
                    const res = await fetch(`${SERVER_URL}/client-status?hw_id=${hwId}`);
                    const data = await res.json();
                    if (data.status) updateStatusBadge(data.status);
                    if (data.balance_tokens !== undefined) {
                        dynamicRuntimeState.balanceTokens = data.balance_tokens;
                        document.getElementById("lbl-balance").innerText = data.balance_tokens.toLocaleString();
                    }
                } catch (e) {}
            }, 6000);
        }

        async function sendLiveProxyCall() {
            const promptText = document.getElementById("test-prompt").value.trim() || "Perform adaptive security token evaluation.";
            const cfg = getConfig();
            logActivity(`Sending dynamic proxy call via ${cfg.model_name}...`);

            try {
                const res = await fetch(`${SERVER_URL}/api/proxy/v1/messages`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-HW-ID': hwId
                    },
                    body: JSON.stringify({ 
                        model: cfg.model_name, 
                        messages: [{ role: 'user', content: promptText }] 
                    })
                });

                if (res.status === 402) {
                    logActivity("Proxy intercepted: Node pending approval on dashboard.", true);
                    return;
                }
                if (!res.ok) throw new Error("Proxy server response error");

                const data = await res.json();
                const inTok = data.usage?.input_tokens || Math.floor(promptText.length / 3) + 10;
                const outTok = data.usage?.output_tokens || Math.floor(promptText.length / 2) + 20;

                logActivity(`Captured live metrics (In: ${inTok}, Out: ${outTok})`);

                const encryptor = new JSEncrypt();
                encryptor.setPublicKey(publicKeyPem);
                const encrypted = encryptor.encrypt(JSON.stringify({
                    m: cfg.model_name,
                    v: dynamicRuntimeState.version,
                    t: profile.type,
                    l: cfg.think_level,
                    i: inTok,
                    o: outTok,
                    b: dynamicRuntimeState.balanceTokens,
                    s: dynamicRuntimeState.subscriptionTier
                }));

                if (encrypted) {
                    const logRes = await fetch(`${SERVER_URL}/log-traffic`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ hw_id: hwId, encrypted_payload: encrypted })
                    });
                    const logData = await logRes.json();
                    if(logData.remaining_balance !== undefined) {
                        dynamicRuntimeState.balanceTokens = logData.remaining_balance;
                        document.getElementById("lbl-balance").innerText = dynamicRuntimeState.balanceTokens.toLocaleString();
                    }
                    logActivity("E2EE dynamic telemetry synchronized successfully.");
                }
            } catch (err) {
                logActivity("Proxy transmission error: " + err.message, true);
            }
            document.getElementById("test-prompt").value = "";
        }

        initAgent();
    </script>
</body>
</html>
