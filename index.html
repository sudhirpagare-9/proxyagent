<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Proxy Security Agent (Live Traffic Interceptor)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
    <style>
        body { background-color: #0b0f17; color: #c9d1d9; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center justify-center">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-4 border-b border-gray-800 pb-3">
            <h1 class="text-sm font-bold text-white flex items-center gap-2">
                🛡️ AI Traffic Interceptor Agent
            </h1>
            <span id="agent-status" class="px-2.5 py-1 bg-amber-950 text-amber-400 border border-amber-800 rounded-full text-[10px] font-mono">Initializing...</span>
        </div>

        <div class="space-y-3 text-xs mb-4">
            <div class="bg-gray-950 p-3 rounded-lg border border-gray-800 space-y-1.5 font-mono">
                <div>HW ID: <span id="lbl-hw" class="text-cyan-400 font-bold">-</span></div>
                <div>Status: <span id="lbl-status" class="text-amber-400 font-bold">Pending Approval</span></div>
            </div>

            <!-- Automatically populated model dropdown based on detected traffic -->
            <div class="space-y-1">
                <label class="block text-[10px] text-gray-400">Detected AI Model / LLM (Auto-populated from traffic)</label>
                <select id="cfg-model" class="w-full bg-gray-950 border border-gray-800 rounded px-2.5 py-1.5 text-xs text-cyan-300 font-mono focus:outline-none focus:border-blue-500">
                    <option value="" disabled selected>Waiting for traffic model detection...</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Country Code</label>
                    <input type="text" id="cfg-country" value="IND" class="w-full bg-gray-950 border border-gray-800 rounded px-2 py-1 text-xs text-white focus:outline-none font-mono">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Geo Location</label>
                    <input type="text" id="cfg-geo" value="Maharashtra" class="w-full bg-gray-950 border border-gray-800 rounded px-2 py-1 text-xs text-white focus:outline-none">
                </div>
            </div>
        </div>

        <div class="space-y-3">
            <div class="border border-gray-800 rounded-lg p-3 bg-gray-950">
                <label class="block text-[11px] font-bold text-gray-300 mb-1">Test Live Proxy AI Request</label>
                <div class="flex gap-2">
                    <input type="text" id="test-prompt" placeholder="Enter prompt specifying model or text..." class="flex-1 bg-gray-900 border border-gray-800 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
                    <button onclick="sendLiveProxyCall()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded text-xs transition">Send</button>
                </div>
            </div>

            <div class="bg-gray-950 rounded-lg p-3 border border-gray-800 h-28 overflow-y-auto font-mono text-[10px] text-gray-400 space-y-1" id="activity-log">
                <div>[System] Interceptor active. Monitoring outgoing traffic...</div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = window.location.origin;
        let hwId = localStorage.getItem("proxy_hw_id");
        if (!hwId) {
            hwId = "AGNT-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            localStorage.setItem("proxy_hw_id", hwId);
        }
        document.getElementById("lbl-hw").innerText = hwId;

        let publicKeyPem = "";
        let balanceTokens = 12500;
        const detectedModels = new Set();

        function logActivity(msg, isError = false) {
            const box = document.getElementById("activity-log");
            const timeStr = new Date().toLocaleTimeString();
            box.innerHTML += `<div class="${isError ? 'text-red-400' : 'text-emerald-400'}">[${timeStr}] ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function registerDetectedModel(modelName) {
            if (!modelName || detectedModels.has(modelName)) return;
            detectedModels.add(modelName);

            const select = document.getElementById("cfg-model");
            if (select.options.length === 1 && select.options[0].disabled) {
                select.innerHTML = ""; // Remove default prompt placeholder
            }

            const opt = document.createElement("option");
            opt.value = modelName;
            opt.textContent = modelName;
            select.appendChild(opt);
            select.value = modelName;

            logActivity(`[Interceptor] Discovered & added model: ${modelName}`);
        }

        // Live Network Interceptor: Capture any fetch call containing AI models or endpoints
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            const url = args[0];
            const options = args[1] || {};

            if (typeof url === 'string' && (url.includes('proxy') || url.includes('chat') || url.includes('messages') || url.includes('openai') || url.includes('anthropic'))) {
                if (options && options.body) {
                    try {
                        const parsed = JSON.parse(options.body);
                        if (parsed.model) {
                            registerDetectedModel(parsed.model);
                        }
                    } catch (e) {}
                }
            }
            return originalFetch.apply(this, args);
        };

        async function initAgent() {
            try {
                const pubRes = await fetch(`${SERVER_URL}/public-key`);
                publicKeyPem = await pubRes.text();

                // Seed with initial detected model if none captured yet
                registerDetectedModel("Claude 3.5 Sonnet");
                await registerAgentWithServer();
                pollStatus();
            } catch (err) {
                logActivity("Initialization error: " + err.message, true);
            }
        }

        async function registerAgentWithServer() {
            const modelSelect = document.getElementById("cfg-model");
            const activeModel = modelSelect.value || "Claude 3.5 Sonnet";
            const country = document.getElementById("cfg-country").value.trim() || "IND";
            const geo = document.getElementById("cfg-geo").value.trim() || "Maharashtra";

            const regRes = await fetch(`${SERVER_URL}/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    hw_id: hwId,
                    hostname: window.location.hostname || "WebAgentNode",
                    mac_address: "CLIENT-MAC-" + hwId.substring(5),
                    client_name: "Live Traffic Agent",
                    model_name: activeModel,
                    model_version: "v1.0",
                    think_level: "Extended",
                    interface_browser: navigator.userAgent.substring(0, 60),
                    input_tokens: 0,
                    output_tokens: 0,
                    balance_tokens: balanceTokens,
                    subscription_status: "PRO",
                    country: country,
                    geo_location: geo
                })
            });
            const regData = await regRes.json();
            updateStatusBadge(regData.client_status || "PENDING");
        }

        function updateStatusBadge(status) {
            const badge = document.getElementById("agent-status");
            const lbl = document.getElementById("lbl-status");
            lbl.innerText = status;
            if (status === "APPROVED") {
                badge.className = "px-2.5 py-1 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded-full text-[10px] font-mono";
                badge.innerText = "Active & Approved";
            } else if (status === "DENIED") {
                badge.className = "px-2.5 py-1 bg-red-950 text-red-400 border border-red-800 rounded-full text-[10px] font-mono";
                badge.innerText = "Access Denied";
            } else {
                badge.className = "px-2.5 py-1 bg-amber-950 text-amber-400 border border-amber-800 rounded-full text-[10px] font-mono";
                badge.innerText = "Pending Approval";
            }
        }

        async function pollStatus() {
            setInterval(async () => {
                try {
                    const res = await fetch(`${SERVER_URL}/client-status?hw_id=${hwId}`);
                    const data = await res.json();
                    if (data.status) updateStatusBadge(data.status);
                } catch (e) {}
            }, 6000);
        }

        async function sendLiveProxyCall() {
            const promptText = document.getElementById("test-prompt").value.trim() || "Analyze real-time network security parameters.";
            const modelSelect = document.getElementById("cfg-model");
            const activeModel = modelSelect.value || "Claude 3.5 Sonnet";
            
            logActivity(`Sending live proxy call for model: ${activeModel}...`);

            try {
                const res = await fetch(`${SERVER_URL}/api/proxy/v1/messages`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-HW-ID': hwId
                    },
                    body: JSON.stringify({ 
                        model: activeModel, 
                        messages: [{ role: 'user', content: promptText }] 
                    })
                });

                if (res.status === 402) {
                    logActivity("Proxy blocked: Client pending dashboard approval.", true);
                    return;
                }
                if (!res.ok) throw new Error("Proxy server error");

                const data = await res.json();
                const inTok = data.usage?.input_tokens || Math.max(12, Math.floor(promptText.length / 3));
                const outTok = data.usage?.output_tokens || Math.max(30, Math.floor(promptText.length / 2) + 20);

                logActivity(`Captured real traffic: ${activeModel} (In: ${inTok}, Out: ${outTok})`);

                const encryptor = new JSEncrypt();
                encryptor.setPublicKey(publicKeyPem);
                const encrypted = encryptor.encrypt(JSON.stringify({
                    m: activeModel,
                    v: "v1.0",
                    t: "Live Proxy API",
                    l: "Extended",
                    i: inTok,
                    o: outTok,
                    b: balanceTokens,
                    s: "PRO"
                }));

                if (encrypted) {
                    await fetch(`${SERVER_URL}/log-traffic`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ hw_id: hwId, encrypted_payload: encrypted })
                    });
                }
            } catch (err) {
                logActivity("Live proxy call error: " + err.message, true);
            }
            document.getElementById("test-prompt").value = "";
        }

        initAgent();
    </script>
</body>
</html>
