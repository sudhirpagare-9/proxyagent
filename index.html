<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure AI Gateway Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 { font-size: 1.5rem; margin: 0; color: var(--accent-color); }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card h3 { margin: 0 0 10px 0; font-size: 0.875rem; color: var(--text-muted); text-transform: uppercase; }
        .card .value { font-size: 2rem; font-weight: bold; }
        .log-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
        }
        th { color: var(--text-muted); }
        pre {
            background: #090d16;
            padding: 8px;
            border-radius: 4px;
            overflow-x: auto;
            max-height: 150px;
            margin: 0;
            color: #38bdf8;
            font-size: 0.75rem;
        }
        .refresh-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .refresh-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔒 Secure AI Gateway & Token Tracker</h1>
            <button class="refresh-btn" onclick="fetchDashboardData()">Refresh Data</button>
        </header>

        <div class="metrics-grid">
            <div class="card">
                <h3>Remaining Balance</h3>
                <div class="value" id="balance-tokens">Loading...</div>
            </div>
            <div class="card">
                <h3>Total Consumed Tokens</h3>
                <div class="value" id="total-consumed">Loading...</div>
            </div>
        </div>

        <div class="log-section">
            <h3>Encrypted Audit Logs & Live Traffic</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tokens Used</th>
                        <th>Timestamp (UTC)</th>
                        <th>Sanitized Payload Preview</th>
                    </tr>
                </thead>
                <tbody id="log-table-body">
                    <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Loading logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";

        async function fetchDashboardData() {
            try {
                const response = await fetch(`${API_BASE}/api/dashboard/stats`);
                if (!response.ok) throw new Error("Failed to fetch gateway statistics.");
                
                const data = await response.json();
                
                document.getElementById("balance-tokens").innerText = data.balance_tokens.toLocaleString();
                document.getElementById("total-consumed").innerText = data.total_consumed.toLocaleString();
                
                const tbody = document.getElementById("log-table-body");
                tbody.innerHTML = "";

                if (data.recent_traffic.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No traffic captured yet.</td></tr>`;
                    return;
                }

                data.recent_traffic.forEach(log => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>#${log.id}</td>
                        <td><span style="color: #34d399; font-weight: bold;">${log.tokens_used}</span></td>
                        <td>${new Date(log.timestamp).toLocaleString()}</td>
                        <td><pre>${escapeHtml(JSON.stringify(log.payload, null, 2))}</pre></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error updating dashboard:", error);
                document.getElementById("balance-tokens").innerText = "Error";
                document.getElementById("total-consumed").innerText = "Error";
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Auto-refresh every 5 seconds
        setInterval(fetchDashboardData, 5000);
        window.onload = fetchDashboardData;
    </script>
</body>
</html>
